name: backfill

# Run by hand once after setup. Loads the SEC ticker map, macro history and benchmark prices,
# and scores the last week of news so the first daily run starts with a watchlist.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of news to score"
        required: false
        default: "7"

permissions:
  contents: read
  issues: write

concurrency:
  group: amia-db
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AMIA_LLM_MONTHLY_CAP_USD: ${{ vars.AMIA_LLM_MONTHLY_CAP_USD || '10' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[postgres]"
      - run: python -m amia backfill --days ${{ inputs.days }}
