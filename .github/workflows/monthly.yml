name: monthly

# 1st of each month: post-mortems, lessons and the evaluation report. It also commits a heartbeat file, because GitHub
# disables scheduled workflows in public repos after 60 days without repository activity.
on:
  schedule:
    - cron: "0 23 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: amia-db
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AMIA_LLM_MONTHLY_CAP_USD: ${{ vars.AMIA_LLM_MONTHLY_CAP_USD || '10' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[postgres]"
      - run: python -m amia monthly | tee report.md
      - name: Heartbeat commit
        run: |
          mkdir -p status
          date -u +"%Y-%m-%dT%H:%M:%SZ" > status/last_monthly_run.txt
          git config user.name "amia-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/last_monthly_run.txt
          git commit -m "Monthly heartbeat" && git push || echo "nothing to commit"
