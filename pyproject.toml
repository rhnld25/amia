[project]
name = "amia"
version = "0.1.0"
description = "Autonomous Market Intelligence Analyst: news-driven discovery, Graham/Buffett/Marks math, LLM decisions, paper portfolio"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amia*"]

[tool.setuptools.package-data]
amia = ["rubrics/*.md", "principles/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
